<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="ambient"><stop stop-color="#92cbbf" stop-opacity=".35"/><stop offset="1" stop-color="#0c0c0c" stop-opacity="0"/></radialGradient>
    <linearGradient id="silver" x2=".85" y2="1"><stop stop-color="#fff"/><stop offset=".4" stop-color="#d7e2ea"/><stop offset="1" stop-color="#788390"/></linearGradient>
    <linearGradient id="fabric" x1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#dfdce9"/><stop offset="1" stop-color="#918ba6"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#41404e"/><stop offset=".55" stop-color="#16141d"/><stop offset="1" stop-color="#252530"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#d7e2ea"/><stop offset=".5" stop-color="#92cbbf"/><stop offset="1" stop-color="#64319b"/></linearGradient>
    <filter id="shadow" x="-70%" y="-70%" width="240%" height="240%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#d7e2ea" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="#0f0f13"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <ellipse cx="600" cy="432" rx="600" ry="560" fill="url(#ambient)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#d7e2ea" text-anchor="middle">
    <text x="600" y="155" font-size="56" font-weight="800" letter-spacing="-2">BUILD YOUR LEARNING PATH</text>
    <text x="600" y="195" font-size="18" fill="#aeb0bf" letter-spacing="4">COURSES / PRACTICE / REVIEW</text>
  </g>
  
    <path d="M600 265V641" stroke="#92cbbf" stroke-width="3" stroke-dasharray="6 10" opacity=".6"/>
    <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <rect x="330" y="265" width="540" height="76" rx="24" fill="url(#glass)" stroke="#92cbbf" stroke-opacity=".4"/><text x="600" y="313" fill="#d7e2ea" font-size="25" font-weight="600">KNOWLEDGE MAP</text><rect x="330" y="365" width="540" height="76" rx="24" fill="url(#silver)" stroke="#92cbbf" stroke-opacity=".4"/><text x="600" y="413" fill="#293244" font-size="25" font-weight="600">COURSES + PRACTICE</text><rect x="330" y="465" width="540" height="76" rx="24" fill="url(#glass)" stroke="#92cbbf" stroke-opacity=".4"/><text x="600" y="513" fill="#d7e2ea" font-size="25" font-weight="600">WEAK POINT ANALYSIS</text><rect x="330" y="565" width="540" height="76" rx="24" fill="url(#glass)" stroke="#92cbbf" stroke-opacity=".4"/><text x="600" y="613" fill="#d7e2ea" font-size="25" font-weight="600">REVIEW</text>
    </g>
  <g fill="#d7e2ea" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="3"><text x="50" y="760" opacity=".4">SHROUD / PROJECT VISUAL</text></g>
</svg>
